server:
  port: 9081
spring:
  application:
    name: LABS_GKE_DEPLOY
  kafka:
    enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME:}" password="${KAFKA_SASL_PASSWORD:}";
    streams:
      auto-startup: ${spring.kafka.enabled}
      application-id: ${spring.application.name}
    admin:
      auto-create: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

management:
  health:
    redis:
      enabled: true # Disable to test with redis
  endpoint:
    health:
      enabled: true
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: ping, redis, kafkaHealthCheck
        liveness:
          include: ping, redis, kafkaHealthCheck
  endpoints:
    web.exposure.include: health,info


health:
  kafka:
    rebalancing-max: PT1M

logging:
  file:
    name: ${logging_file_name:logs/app.log}