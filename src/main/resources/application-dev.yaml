server:
  port: 9081
spring:
  application:
    name: LABS_GKE_DEPLOY
  kafka:
    enabled: false
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME:}" password="${KAFKA_SASL_PASSWORD:}";
    streams:
      auto-startup: ${spring.kafka.enabled}
      application-id: ${spring.application.name}
    admin:
      auto-create: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
      password: ${REDIS_PASSWORD}


health:
  kafka:
    rebalancing-max: PT1M

logging:
  file:
    name: ${logging_file_name}