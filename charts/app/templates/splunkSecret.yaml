{{- if .Values.splunk.enabled }}
{{- if or (eq .Values.gcp.secretManager.splunk.secretProvider "gcp") (eq .Values.gcp.secretManager.splunk.secretProvider "gke") }}
{{- if $fileNameOrPath := ternary "fileName" "path" (eq .Values.gcp.secretManager.splunk.secretProvider "gcp") }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "labs-helmchart-base.buildName" (list . "envsp") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labs-helmchart-base.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.gcp.secretManager.splunk.secretProvider | quote }}
  parameters:
    secrets: |
    {{- range $secret := .Values.gcp.secretManager.splunk.secrets }}
      - resourceName: "projects/{{ $.Values.gcp.projectNumber }}/secrets/{{ $secret.name }}/versions/latest"
        {{$fileNameOrPath}}: {{ $secret.fileName | quote }}
    {{- end }}

  {{- if and .Values.gcp.secretManager.splunk.secretSyncEnabled (eq .Values.gcp.secretManager.splunk.secretProvider "gcp") }}
  secretObjects:
      - secretName: {{ include "labs-helmchart-base.buildName" (list . "sec") }}
        type: Opaque
        data:
        {{- range $secret := .Values.gcp.secretManager.splunk.secrets }}
          - objectName: {{ $secret.name | quote }}
            key: {{ $secret.key | quote }}
        {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
